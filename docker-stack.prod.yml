version: "3.8"

services:
  # Wallet App Frontend - Produção Hostinger Swarm
  wallet-app:
    # Imagem imutável por SHA/tag ou latest por padrão
    image: ${WALLET_IMAGE:-heitor84/wallet:latest}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
      labels:
        # Traefik Habilitado
        - "traefik.enable=true"
        
        # Rede Swarm Externa
        - "traefik.swarm.network=network_public"
        
        # Porta interna do Nginx
        - "traefik.http.services.wallet-app-service.loadbalancer.server.port=80"
        
        # Roteamento Seguro (HTTPS)
        - "traefik.http.routers.wallet-app-secure.rule=Host(`wallet.wonderwold.com.br`)"
        - "traefik.http.routers.wallet-app-secure.entrypoints=websecure"
        - "traefik.http.routers.wallet-app-secure.tls=true"
        - "traefik.http.routers.wallet-app-secure.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.wallet-app-secure.service=wallet-app-service"
        
        # Redirecionamento HTTP -> HTTPS
        - "traefik.http.routers.wallet-app-insecure.rule=Host(`wallet.wonderwold.com.br`)"
        - "traefik.http.routers.wallet-app-insecure.entrypoints=web"
        - "traefik.http.routers.wallet-app-insecure.middlewares=wallet-redirect-https"
        - "traefik.http.middlewares.wallet-redirect-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.wallet-redirect-https.redirectscheme.permanent=true"
        
    networks:
      - network_public

networks:
  network_public:
    external: true
