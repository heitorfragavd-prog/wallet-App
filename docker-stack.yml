version: "3.8"

services:
  # Wallet App Frontend
  wallet-app:
    image: heltonfraga/wallet:1.0.2
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      labels:
        # Traefik - Enable
        - "traefik.enable=true"
        
        # Traefik - Service Configuration
        # Define explicitamente qual porta o Traefik deve usar para se conectar ao container
        - "traefik.http.services.wallet-app-service.loadbalancer.server.port=80"
        
        # Traefik - HTTPS Router
        - "traefik.http.routers.wallet-app-secure.rule=Host(`wallet.cortexx.online`)"
        - "traefik.http.routers.wallet-app-secure.entrypoints=websecure"
        - "traefik.http.routers.wallet-app-secure.tls=true"
        - "traefik.http.routers.wallet-app-secure.tls.certresolver=leresolver"
        - "traefik.http.routers.wallet-app-secure.service=wallet-app-service"
        
        # Traefik - HTTP Router (redirect to HTTPS)
        - "traefik.http.routers.wallet-app-insecure.rule=Host(`wallet.cortexx.online`)"
        - "traefik.http.routers.wallet-app-insecure.entrypoints=web"
        - "traefik.http.routers.wallet-app-insecure.middlewares=wallet-redirect-https"
        
        # Traefik - HTTPS Redirect Middleware
        - "traefik.http.middlewares.wallet-redirect-https.redirectscheme.scheme=https"
        - "traefik.http.middlewares.wallet-redirect-https.redirectscheme.permanent=true"
        
    networks:
      - network_public

networks:
  network_public:
    external: true
