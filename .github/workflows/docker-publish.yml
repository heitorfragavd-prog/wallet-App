name: Build & Push Docker Image

# Builda a imagem multi-arquitetura e publica no Docker Hub.
# Secrets necessários no repositório (Settings > Secrets and variables > Actions):
#   DOCKERHUB_USERNAME     - usuário do Docker Hub (heltonfraga)
#   DOCKERHUB_TOKEN        - access token do Docker Hub
#   VITE_SUPABASE_URL      - URL do projeto Supabase
#   VITE_SUPABASE_ANON_KEY - anon key do Supabase

on:
  push:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'heltonfraga' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            heltonfraga/wallet:1.0.3
            heltonfraga/wallet:latest
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'Wallet' }}
            VITE_APP_URL=https://wallet.cortexx.online
            VITE_APP_ENVIRONMENT=production
            VITE_ENABLE_ANALYTICS=false
            VITE_ENABLE_DEBUG_LOGS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
