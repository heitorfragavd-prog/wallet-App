name: Build & Push Docker Image

# Publica no Docker Hub SOMENTE após o CI Quality Gates concluir com sucesso no push para develop ou master.
# Impede que PRs ou commits que falhem nos testes gerem/substituam imagens Docker.

on:
  workflow_run:
    workflows: ["CI Quality Gates"]
    branches:
      - develop
      - master
    types:
      - completed

concurrency:
  group: docker-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'develop' || github.event.workflow_run.head_branch == 'master')

    steps:
      - name: Checkout exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Determine Docker Image Tags
        id: meta
        run: |
          TARGET_BRANCH="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA=$(echo "${HEAD_SHA}" | cut -c1-7)
          APP_VERSION=$(node -p "require('./package.json').version")
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"

          echo "Target branch: ${TARGET_BRANCH}"
          echo "Commit SHA: ${HEAD_SHA} (${SHORT_SHA})"
          echo "App Version: ${APP_VERSION}"

          if [ "${TARGET_BRANCH}" = "master" ]; then
            TAGS="${DOCKER_USER}/wallet:latest,${DOCKER_USER}/wallet:${APP_VERSION},${DOCKER_USER}/wallet:master-${SHORT_SHA}"
          elif [ "${TARGET_BRANCH}" = "develop" ]; then
            TAGS="${DOCKER_USER}/wallet:develop,${DOCKER_USER}/wallet:develop-${SHORT_SHA}"
          else
            TAGS="${DOCKER_USER}/wallet:${TARGET_BRANCH}-${SHORT_SHA}"
          fi

          echo "Computed tags: ${TAGS}"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'Wallet' }}
            VITE_APP_URL=https://wallet.cortexx.online
            VITE_APP_ENVIRONMENT=production
            VITE_ENABLE_ANALYTICS=false
            VITE_ENABLE_DEBUG_LOGS=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
