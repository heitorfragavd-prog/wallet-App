name: Security Audit Isolated PostgreSQL Tests

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - security/comprehensive-audit-hardening
  workflow_dispatch:

concurrency:
  group: sec-pg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pg-isolated-tests:
    name: Real PostgreSQL Security, Concurrency & Permissions Battery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run PostgreSQL Security Battery (Phase A, Phase C, RLS, Concurrency & Column Security)
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -f scripts/test-isolated-pg-security.sql