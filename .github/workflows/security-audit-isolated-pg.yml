name: Security Audit Isolated PostgreSQL Tests

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - security/comprehensive-audit-hardening
  workflow_dispatch:

concurrency:
  group: sec-pg-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pg-isolated-tests:
    name: Real PostgreSQL Security, Concurrency & Permissions Battery
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pg client for concurrency tests
        run: npm install --no-save pg

      - name: Run PostgreSQL Security Battery (Phase A, Phase C, RLS, Concurrency & Column Security)
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -f scripts/test-isolated-pg-security.sql

      - name: Run Phase A/B/C Operational Gating Verification
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -f scripts/test-phase-abc-gating.sql

      - name: Run Real Schema Compatibility Battery (Phase A -> Phase B -> Phase C -> 9 Scenarios)
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -f scripts/test-real-schema-compat.sql

      - name: Run Phase A -> Phase B -> Phase C Sequential Rehearsal & Safe Contingency
        env:
          PGPASSWORD: postgrespassword
        run: |
          psql -h localhost -U postgres -d postgres -f scripts/test-phase-abc-rehearsal.sql

      - name: Run Real Concurrency Battery (Multiple Connections Pool)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/postgres
        run: |
          node scripts/test-real-concurrency.cjs

  edge-functions-validation:
    name: Edge Functions Runtime Validation (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate Edge Functions on Deno Runtime
        run: |
          deno check supabase/functions/openai-proxy/index.ts
          deno check supabase/functions/categorizar-ia/index.ts
          deno check supabase/functions/ia-deposito/index.ts
          deno check supabase/functions/divipay-api/index.ts
          deno check supabase/functions/divipay-webhook/index.ts
          deno check supabase/functions/validar-senha/index.ts

  e2e-browser-homologation:
    name: Full E2E Browser & Real Supabase Stack Homologation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Real Supabase Stack (PostgreSQL, Auth, PostgREST, Inbucket)
        run: |
          # Isola a migracao da Fase C para respeitar o gating durante o start inicial da Fase A
          mkdir -p supabase/phase_c
          mv supabase/migrations/20260908120001_security_phase_c_enforcement.sql supabase/phase_c/
          supabase start
          # Retorna a migracao para o diretorio apos o start
          mv supabase/phase_c/20260908120001_security_phase_c_enforcement.sql supabase/migrations/
          rm -rf supabase/phase_c

      - name: Install Playwright and Dependencies
        run: |
          npm install --no-save @playwright/test
          npx playwright install --with-deps chromium

      - name: Start Mock External Providers (OpenAI, Divipay, Eyemobile)
        run: |
          node tests/mock-external-providers.cjs &
          sleep 2

      - name: Run Playwright E2E Security Homologation Suite
        run: |
          export VITE_SUPABASE_URL=http://127.0.0.1:54321
          export VITE_SUPABASE_ANON_KEY=$(supabase status -o env | grep ANON_KEY | cut -d '=' -f2 | tr -d '"' | tr -d "'")
          export INBUCKET_URL=http://127.0.0.1:54324
          export MOCK_PROVIDER_URL=http://127.0.0.1:18080
          npx playwright test tests/security-homologation.spec.ts